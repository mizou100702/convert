<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
@page{size:91mm 61mm;margin:0}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#111}
:root{--gold:linear-gradient(115deg,#8a6a2f 0%,#e9cf8a 22%,#fff3c9 38%,#c9a254 55%,#f3dc9a 72%,#9c7633 100%);--g:#d8b56a}
.card{width:91mm;height:61mm;position:relative;overflow:hidden;page-break-after:always;
  background:radial-gradient(120% 90% at 85% 10%,#2a2114 0%,#0d0b08 45%,#050403 100%);color:#efe3c4;font-family:Montserrat,sans-serif}
.safe{position:absolute;inset:3mm;}               /* format fini 85x55 */
.inner{position:absolute;inset:7mm}               /* zone de sécurité */
.goldtxt{background:var(--gold);-webkit-background-clip:text;background-clip:text;color:transparent}
.frame{position:absolute;inset:5.5mm;border:.25mm solid rgba(216,181,106,.55)}
.frame:after{content:"";position:absolute;inset:.9mm;border:.12mm solid rgba(216,181,106,.25)}
/* arcs = trajectoire de vol */
.arc{position:absolute;inset:0;width:100%;height:100%}
/* RECTO */
.front .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.mono{width:15mm;height:15mm;margin-bottom:3.2mm}
.brand{font-family:Cinzel,serif;font-weight:600;font-size:16pt;letter-spacing:.24em;padding-left:.24em;line-height:1}
.rule{display:flex;align-items:center;gap:2mm;margin:2.6mm 0 2.2mm;color:var(--g)}
.rule i{display:block;width:10mm;height:.2mm;background:linear-gradient(90deg,transparent,var(--g))}
.rule i:last-child{transform:scaleX(-1)}
.rule svg{width:3.4mm;height:3.4mm}
.tag{font-size:5.2pt;letter-spacing:.34em;padding-left:.34em;color:#d9c79f;font-weight:500}
/* VERSO */
.back{background:radial-gradient(130% 100% at 0% 100%,#2a2114 0%,#0d0b08 50%,#050403 100%)}
.back .inner{inset:8.2mm 8.5mm;display:flex;gap:4.5mm;align-items:stretch}
.col{flex:1;display:flex;flex-direction:column;justify-content:space-between}
.eyebrow{font-size:4.6pt;letter-spacing:.36em;color:#bfa871;font-weight:600}
.headline{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:13.5pt;line-height:1.02;margin-top:1.2mm}
.headline em{font-style:italic;font-weight:500}
.svc{list-style:none;font-size:5.4pt;letter-spacing:.06em;color:#e8dcc0;line-height:1.75}
.svc li:before{content:"";display:inline-block;width:1.3mm;height:1.3mm;transform:rotate(45deg) translateY(-.3mm);border:.18mm solid var(--g);margin-right:1.6mm}
.dest{font-size:4.4pt;letter-spacing:.2em;color:#a89366;line-height:1.5}
.qrbox{width:23mm;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.6mm}
.qr{width:21mm;height:21mm;padding:1.5mm;border-radius:1.6mm;background:linear-gradient(135deg,#f6e3ad,#d4ae5f 55%,#f2d993)}
.qr img{width:100%;height:100%;display:block}
.handle{font-family:Montserrat;font-weight:600;font-size:7pt;letter-spacing:.02em}
.snap{font-size:4.4pt;letter-spacing:.3em;color:#bfa871;display:flex;align-items:center;gap:1mm}
.snap svg{width:2.6mm;height:2.6mm}
.vline{width:.2mm;background:linear-gradient(180deg,transparent,rgba(216,181,106,.7),transparent)}
</style></head><body>

<!-- ============ RECTO ============ -->
<section class="card front">
  <svg class="arc" viewBox="0 0 910 610" preserveAspectRatio="none">
    <defs><linearGradient id="ga" x1="0" x2="1"><stop offset="0" stop-color="#d8b56a" stop-opacity="0"/><stop offset=".5" stop-color="#d8b56a" stop-opacity=".35"/><stop offset="1" stop-color="#d8b56a" stop-opacity="0"/></linearGradient></defs>
    <path d="M-40 520 Q 455 120 950 470" fill="none" stroke="url(#ga)" stroke-width="1.4" stroke-dasharray="2 7"/>
    <path d="M-40 600 Q 455 230 950 560" fill="none" stroke="url(#ga)" stroke-width=".8"/>
  </svg>
  <div class="frame"></div>
  <div class="center">
    <svg class="mono" viewBox="0 0 100 100">
      <defs><linearGradient id="gm" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#8a6a2f"/><stop offset=".3" stop-color="#f3dc9a"/><stop offset=".5" stop-color="#fff3c9"/><stop offset=".7" stop-color="#c9a254"/><stop offset="1" stop-color="#9c7633"/></linearGradient></defs>
      <rect x="18" y="18" width="64" height="64" transform="rotate(45 50 50)" fill="none" stroke="url(#gm)" stroke-width="1.6"/>
      <rect x="23" y="23" width="54" height="54" transform="rotate(45 50 50)" fill="none" stroke="url(#gm)" stroke-width=".6" opacity=".6"/>
      <text x="50" y="62" text-anchor="middle" font-family="Cinzel" font-weight="700" font-size="25" fill="url(#gm)">F&amp;M</text>
    </svg>
    <div class="brand goldtxt">FLY &amp; MORE</div>
    <div class="rule"><i></i><svg viewBox="0 0 24 24" fill="currentColor"><path d="M21 16v-2l-8-5V3.5a1.5 1.5 0 0 0-3 0V9l-8 5v2l8-2.5V19l-2 1.5V22l3.5-1 3.5 1v-1.5L13 19v-5.5z"/></svg><i></i></div>
    <div class="tag">BUSINESS &amp; FIRST CLASS TRAVEL</div>
  </div>
</section>

<!-- ============ VERSO ============ -->
<section class="card back">
  <div class="frame"></div>
  <div class="inner">
    <div class="col">
      <div>
        <div class="eyebrow">TRAVEL CONCIERGE</div>
        <div class="headline goldtxt">The world<br><em>in Business &amp; First</em></div>
      </div>
      <ul class="svc">
        <li>Fast booking</li>
        <li>Negotiated fares</li>
        <li>Personal assistance</li>
      </ul>
      <div class="dest">DUBAI · PHUKET · BALI · MIAMI<br>DAKAR · LOS ANGELES · TOKYO</div>
    </div>
    <div class="vline"></div>
    <div class="qrbox">
      <div class="qr"><img src="qr.svg" alt=""></div>
      <div class="snap"><svg viewBox="0 0 24 24" fill="#d8b56a"><path d="M12 2.5c3.3 0 5.6 2.5 5.6 5.7v2.4c.5.2 1.3-.3 1.8-.1.6.3.4 1-.2 1.3-.7.4-1.8.6-1.7 1.3.5 1.9 2.2 3.4 3.8 3.8.5.1.5.7 0 .9-1 .5-2 .4-2.3.9-.2.4 0 1-.6 1.1-.9.2-1.9-.3-3 .1-1.2.5-1.9 1.6-3.4 1.6s-2.2-1.1-3.4-1.6c-1.1-.4-2.1.1-3-.1-.6-.1-.4-.7-.6-1.1-.3-.5-1.3-.4-2.3-.9-.5-.2-.5-.8 0-.9 1.6-.4 3.3-1.9 3.8-3.8.1-.7-1-.9-1.7-1.3-.6-.3-.8-1-.2-1.3.5-.2 1.3.3 1.8.1V8.2c0-3.2 2.3-5.7 5.6-5.7z"/></svg>SNAPCHAT</div>
      <div class="handle goldtxt">@endofera0</div>
    </div>
  </div>
</section>
</body></html>
